// Wave composition: which enemy types may appear at wave N, and how many.
function waveComposition(n) {
  const budget = Math.round(8 + n * 3.6 + Math.pow(n, 1.35) * 0.9);
  const pool = ['grunt'];
  if (n >= 2) pool.push('darter');
  if (n >= 3) pool.push('spitter');
  if (n >= 4) pool.push('swarm');
  if (n >= 6) pool.push('splitter');
  if (n >= 7) pool.push('orbiter');
  if (n >= 9) pool.push('bomber');
  if (n >= 11) pool.push('brute');
  const cost = { grunt: 2, darter: 3, spitter: 4, swarm: 1, splitter: 6, orbiter: 4, bomber: 5, brute: 12, shard: 1 };
  return { budget, pool, cost };
}

// HP and count scaling per wave.
function waveScale(n) {
  return {
    hp: 1 + (n - 1) * 0.16 + Math.pow(n, 1.6) * 0.008,
    dmg: 1 + (n - 1) * 0.055,
    speed: 1 + Math.min(0.55, (n - 1) * 0.02),
  };
}

// ============================================================
// Utilities: math, RNG, pools, spatial hash.
// ============================================================
const TAU = Math.PI * 2;

function rand(a, b) { return a + Math.random() * (b - a); }
function irand(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function chance(p) { return Math.random() < p; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function ang(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function normAng(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function approach(v, target, delta) {
  if (v < target) return Math.min(v + delta, target);
  return Math.max(v - delta, target);
}
// Frame-rate independent exponential damping.
function damp(v, target, rate, dt) { return lerp(v, target, 1 - Math.exp(-rate * dt)); }

// Seeded RNG (mulberry32). Used for arena layout so a run is reproducible
// from its seed and for the music sequencer.
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Simple weighted pick from [{w: weight, ...}] arrays.
function weightedPick(items, rng) {
  const r = rng || Math.random;
  let total = 0;
  for (const it of items) total += it.w;
  let x = r() * total;
  for (const it of items) { x -= it.w; if (x <= 0) return it; }
  return items[items.length - 1];
}

// ------------------------------------------------------------
// Object pool. Reuses dead entries so the GC never sees the loop.
// ------------------------------------------------------------
class Pool {
  constructor(factory, size) {
    this.items = new Array(size);
    for (let i = 0; i < size; i++) this.items[i] = factory();
    this.count = 0; // active entries live at [0, count)
  }
  get() {
    if (this.count < this.items.length) {
      const o = this.items[this.count];
      this.count++;
      return o;
    }
    // Pool exhausted: recycle the oldest slot rather than grow forever.
    const o = this.items[0];
    // shift active range by rotating first item out
    this.items[0] = this.items[this.count - 1];
    this.items[this.count - 1] = o;
    return o;
  }
  release(i) {
    const last = this.count - 1;
    const tmp = this.items[i];
    this.items[i] = this.items[last];
    this.items[last] = tmp;
    this.count--;
  }
  clear() { this.count = 0; }
  forEach(fn) {
    // iterate backwards so fn may release entries safely
    for (let i = this.count - 1; i >= 0; i--) fn(this.items[i], i);
  }
}

// ------------------------------------------------------------
// Spatial hash: broad-phase collision for hundreds of bodies.
// ------------------------------------------------------------
class SpatialHash {
  constructor(cell) {
    this.cell = cell;
    this.map = new Map();
  }
  key(cx, cy) { return cx * 73856093 ^ cy * 19349663; }
  clear() { this.map.clear(); }
  insert(o) {
    const c = this.cell;
    const x0 = Math.floor((o.x - o.r) / c), x1 = Math.floor((o.x + o.r) / c);
    const y0 = Math.floor((o.y - o.r) / c), y1 = Math.floor((o.y + o.r) / c);
    for (let cy = y0; cy <= y1; cy++)
      for (let cx = x0; cx <= x1; cx++) {
        const k = this.key(cx, cy);
        let arr = this.map.get(k);
        if (!arr) { arr = []; this.map.set(k, arr); }
        arr.push(o);
      }
  }
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cy = y0; cy <= y1; cy++)
      for (let cx = x0; cx <= x1; cx++) {
        const arr = this.map.get(this.key(cx, cy));
        if (arr) for (const o of arr) out.push(o);
      }
    return out;
  }
}

// Circle vs circle overlap.
function circleHit(ax, ay, ar, bx, by, br) {
  const rr = ar + br;
  return dist2(ax, ay, bx, by) <= rr * rr;
}

// Circle vs axis-aligned rect.
function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw);
  const ny = clamp(cy, ry, ry + rh);
  return dist2(cx, cy, nx, ny) <= cr * cr;
}

// Draw helper: text with optional glow.
function drawText(ctx, text, x, y, size, color, align, bold) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px "Courier New", monospace';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// Volume ladder for the settings screen.
function nextVol(v) {
  const ladder = [0, 0.25, 0.5, 0.75, 1];
  const i = ladder.indexOf(Math.round(v * 100) / 100);
  return ladder[(i + 1) % ladder.length];
}

// ============================================================
// Persistent save data via localStorage.
// ============================================================
const Save = {
  data: null,

  defaults() {
    return {
      best: 0,
      bestWave: 0,
      runs: 0,
      totalKills: 0,
      credits: 0,
      meta: {},          // meta shop id -> level purchased
      seenIntro: false,
      seenHowTo: false,
      settings: {
        sfx: 0.8,
        music: 0.6,
        shake: 1.0,      // 0 disables screen shake
        reducedMotion: false,
      },
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(CFG.saveKey);
      if (raw) {
        this.data = Object.assign(this.defaults(), JSON.parse(raw));
        this.data.settings = Object.assign(
          this.defaults().settings, this.data.settings || {});
      } else {
        this.data = this.defaults();
      }
    } catch (e) {
      this.data = this.defaults();
    }
    // Apply meta shop purchases to the stat base.
    this.applyMeta();
    return this.data;
  },

  save() {
    try { localStorage.setItem(CFG.saveKey, JSON.stringify(this.data)); }
    catch (e) { /* storage full or blocked: run continues without saving */ }
  },

  metaLevel(id) { return this.data.meta[id] || 0; },

  applyMeta() {
    const base = baseStats();
    for (const item of META_SHOP) {
      const lvl = this.metaLevel(item.id);
      for (let i = 0; i < lvl; i++) item.apply(base);
    }
    Save.statBase = base;
  },

  recordRun(score, wave, kills, credits) {
    const d = this.data;
    d.runs++;
    d.totalKills += kills;
    d.credits += credits;
    if (score > d.best) d.best = score;
    if (wave > d.bestWave) d.bestWave = wave;
    this.save();
  },
};

// Procedural audio engine. Zero sound files: every effect and
// the music loop are synthesized with WebAudio oscillators.
// Must be initialized from a user gesture (autoplay policy).
// ============================================================
const AudioSys = {
  ctx: null,
  master: null,
  sfxBus: null,
  musicBus: null,
  noiseBuf: null,
  musicOn: false,
  musicTimer: null,
  musicStep: 0,
  musicNextTime: 0,
  intensity: 0,   // 0..1, driven by wave number and boss fights

  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);

    this.sfxBus = this.ctx.createGain();
    this.sfxBus.gain.value = Save.data.settings.sfx;
    this.sfxBus.connect(this.master);

    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = Save.data.settings.music;
    this.musicBus.connect(this.master);

    // Pre-baked white noise buffer, reused by every noise-based effect.
    const len = this.ctx.sampleRate * 1.2;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const ch = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    this.resume();
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  applySettings() {
    if (!this.ctx) return;
    this.sfxBus.gain.value = Save.data.settings.sfx;
    this.musicBus.gain.value = Save.data.settings.music;
  },

  // One envelope-shaped oscillator voice.
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  },

  // One filtered noise burst.
  noise(dur, vol, filterFreq, slideTo, delay) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(filterFreq || 1200, t0);
    if (slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  },

  // Pitch variation on every call keeps repetition fatigue away.
  shoot() {
    const p = rand(0.92, 1.08);
    this.tone(660 * p, 0.09, 'square', 0.10, 180 * p);
    this.noise(0.05, 0.05, 3000, 800);
  },
  shotgun() {
    this.noise(0.18, 0.22, 2200, 300);
    this.tone(180, 0.14, 'square', 0.12, 60);
  },
  laser() {
    this.tone(1400, 0.22, 'sawtooth', 0.12, 220);
    this.noise(0.14, 0.06, 6000, 1200);
  },
  missile() {
    this.noise(0.3, 0.10, 900, 200);
    this.tone(300, 0.25, 'sawtooth', 0.06, 90);
  },
  hit() {
    const p = rand(0.9, 1.1);
    this.noise(0.06, 0.10, 1800 * p, 400);
  },
  crit() {
    this.tone(1100, 0.07, 'square', 0.10, 1900);
    this.noise(0.08, 0.10, 4000, 900);
  },
  explode(big) {
    const v = big ? 0.34 : 0.2;
    this.noise(big ? 0.6 : 0.34, v, big ? 900 : 1400, 60);
    this.tone(big ? 90 : 130, big ? 0.5 : 0.3, 'sine', v, 35);
  },
  hurt() {
    this.tone(140, 0.2, 'sawtooth', 0.18, 55);
    this.noise(0.15, 0.12, 800, 200);
  },
  dash() {
    this.noise(0.16, 0.10, 500, 3500);
  },
  pickup() {
    const p = rand(0.95, 1.05);
    this.tone(520 * p, 0.06, 'square', 0.07);
    this.tone(780 * p, 0.08, 'square', 0.07, undefined, 0.05);
  },
  gem() {
    const p = rand(0.94, 1.06);
    this.tone(920 * p, 0.05, 'triangle', 0.05, 1250 * p);
  },
  levelup() {
    const p = rand(0.98, 1.02);
    this.tone(440 * p, 0.12, 'triangle', 0.10);
    this.tone(554 * p, 0.12, 'triangle', 0.10, undefined, 0.09);
    this.tone(659 * p, 0.2, 'triangle', 0.12, undefined, 0.18);
  },
  buy() {
    this.tone(700, 0.07, 'square', 0.09);
    this.tone(1050, 0.1, 'square', 0.09, undefined, 0.07);
  },
  click() {
    this.tone(340, 0.04, 'square', 0.06);
  },
  waveStart() {
    this.tone(220, 0.18, 'sawtooth', 0.09, 440);
    this.tone(440, 0.22, 'sawtooth', 0.09, 880, 0.12);
  },
  bossRoar() {
    this.tone(70, 0.9, 'sawtooth', 0.26, 45);
    this.noise(0.8, 0.16, 500, 100);
    this.tone(140, 0.7, 'square', 0.12, 90);
  },
  gameOver() {
    this.tone(330, 0.4, 'sawtooth', 0.14, 110);
    this.tone(165, 0.7, 'sawtooth', 0.12, 55, 0.3);
    this.noise(0.9, 0.1, 600, 80, 0.2);
  },

  // ----------------------------------------------------------
  // Music: a seeded, generative dark-synthwave loop.
  // Bass line plus arp, layers switch on as intensity rises.
  // Scheduled ~0.2s ahead of the audio clock.
  // ----------------------------------------------------------
  startMusic(seed) {
    if (!this.ctx) return;
    this.stopMusic();
    this.rng = makeRng(seed || 1337);
    // Minor scale root progression, 8 bars.
    this.roots = [55, 55, 65.4, 49, 55, 55, 73.4, 65.4]; // A1 A1 C2 G1...
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.musicOn = true;
    this.musicTimer = setInterval(() => this.schedule(), 60);
  },

  stopMusic() {
    this.musicOn = false;
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
  },

  setIntensity(v) {
    this.intensity = clamp(v, 0, 1);
  },

  schedule() {
    if (!this.ctx || !this.musicOn) return;
    const lookahead = 0.22;
    const bpm = 96 + Math.floor(this.intensity * 46);
    const stepDur = 60 / bpm / 4; // 16th notes
    while (this.nextTime < this.ctx.currentTime + lookahead) {
      this.playStep(this.step, this.nextTime, stepDur);
      this.step = (this.step + 1) % 128;
      this.nextTime += stepDur;
    }
  },

  playStep(s, t, dur) {
    const ctx = this.ctx;
    const bar = Math.floor(s / 16);
    const beat = s % 16;
    const root = this.roots[bar];
    const I = this.intensity;
    const mus = this.musicBus;

    // Kick on quarters once intensity passes 0.15
    if (beat % 4 === 0 && I > 0.12) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.30 * (0.4 + I), t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g).connect(mus);
      o.start(t); o.stop(t + 0.2);
    }
    // Hi-hat noise on off-beats at higher intensity
    if (beat % 4 === 2 && I > 0.35) {
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 7000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05 + I * 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      src.connect(f).connect(g).connect(mus);
      src.start(t); src.stop(t + 0.08);
    }
    // Bass: pulsing root on 8ths
    if (beat % 2 === 0) {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.value = root;
      f.type = 'lowpass';
      f.frequency.setValueAtTime(300 + I * 700, t);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.8);
      o.connect(f).connect(g).connect(mus);
      o.start(t); o.stop(t + dur * 2);
    }
    // Arp: minor triad pattern on 16ths, density scales with intensity
    const arpPattern = [0, 3, 7, 12, 7, 3];
    if (beat % 2 === 1 && (I > 0.25 || this.rng() < 0.5)) {
      const idx = Math.floor(beat / 2) % arpPattern.length;
      const semi = arpPattern[idx];
      const freq = root * 4 * Math.pow(2, semi / 12);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.05 + I * 0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.4);
      o.connect(g).connect(mus);
      o.start(t); o.stop(t + dur * 1.6);
    }
    // Pad: sustained fifth at bar starts
    if (beat === 0) {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'triangle';
      o.frequency.value = root * 2;
      f.type = 'lowpass'; f.frequency.value = 900;
      const barDur = dur * 16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + barDur * 0.3);
      g.gain.linearRampToValueAtTime(0.0001, t + barDur);
      o.connect(f).connect(g).connect(mus);
      o.start(t); o.stop(t + barDur + 0.1);
    }
  },
};

// ============================================================
// FX: pooled particles, floating damage text, screen shake,
// hit stop, flashes. The juice layer.
// ============================================================
const FX = {
  parts: null,
  texts: null,
  shakeMag: 0,
  shakeX: 0,
  shakeY: 0,
  hitStopT: 0,
  flashT: 0,
  flashColor: '#fff',
  vignette: 0,

  init() {
    this.parts = new Pool(() => ({
      active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0,
      size: 2, color: '#fff', type: 0, drag: 0.9, grav: 0, rot: 0, spin: 0, w: 0,
    }), CFG.particleMax);
    this.texts = new Pool(() => ({
      active: false, x: 0, y: 0, vy: 0, life: 0, maxLife: 0,
      text: '', size: 14, color: '#fff',
    }), CFG.floatTextMax);
  },

  reset() {
    this.parts.clear();
    this.texts.clear();
    this.shakeMag = 0;
    this.hitStopT = 0;
    this.flashT = 0;
    this.vignette = 0;
  },

  // --- screen-level effects -----------------------------------
  shake(mag) {
    if (Save.data.settings.reducedMotion) return;
    this.shakeMag = Math.min(28, Math.max(this.shakeMag, mag * (Save.data.settings.shake || 1)));
  },
  hitStop(seconds) {
    if (Save.data.settings.reducedMotion) return;
    this.hitStopT = Math.max(this.hitStopT, seconds);
  },
  flash(color, strength) {
    if (Save.data.settings.reducedMotion) return;
    this.flashColor = color;
    this.flashT = Math.max(this.flashT, strength || 0.18);
  },
  pulseVignette(amount) {
    this.vignette = Math.min(1, this.vignette + amount);
  },

  // --- particles ----------------------------------------------
  spawn(x, y, opts) {
    const p = this.parts.get();
    p.active = true;
    p.x = x; p.y = y;
    p.vx = opts.vx || 0; p.vy = opts.vy || 0;
    p.maxLife = opts.life || 0.5; p.life = p.maxLife;
    p.size = opts.size || 3;
    p.color = opts.color || '#fff';
    p.type = opts.type || 0;      // 0 dot, 1 spark(line), 2 ring, 3 shard
    p.drag = opts.drag !== undefined ? opts.drag : 3;
    p.rot = opts.rot || 0;
    p.spin = opts.spin || 0;
    return p;
  },

  burst(x, y, color, count, speed, size, life) {
    count = Math.min(count, 60);
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const s = rand(speed * 0.3, speed);
      this.spawn(x, y, {
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        color, size: rand(size * 0.6, size * 1.4),
        life: rand(life * 0.6, life * 1.3),
        type: chance(0.5) ? 1 : 0,
        drag: 4, spin: rand(-8, 8),
      });
    }
  },

  ring(x, y, color, maxR, life, width) {
    const p = this.spawn(x, y, { color, life: life || 0.35, type: 2, size: maxR || 60 });
    p.w = width || 3;
  },

  smoke(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      this.spawn(x + rand(-6, 6), y + rand(-6, 6), {
        vx: rand(-30, 30), vy: rand(-40, -10),
        color, size: rand(4, 9), life: rand(0.5, 1.1), drag: 1.5, type: 0,
      });
    }
  },

  trail(x, y, color, size) {
    this.spawn(x, y, {
      color, size: size || 3, life: 0.3, drag: 5, type: 0,
      vx: rand(-15, 15), vy: rand(-15, 15),
    });
  },

  // --- floating text ------------------------------------------
  text(x, y, str, color, size) {
    const t = this.texts.get();
    t.active = true;
    t.x = x + rand(-6, 6); t.y = y;
    t.vy = -55;
    t.maxLife = 0.75; t.life = t.maxLife;
    t.text = str; t.color = color || '#fff';
    t.size = size || 14;
  },

  // --- update / draw ------------------------------------------
  update(dt) {
    this.parts.forEach((p, i) => {
      p.life -= dt;
      if (p.life <= 0) { this.parts.release(i); return; }
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
    });
    this.texts.forEach((t, i) => {
      t.life -= dt;
      if (t.life <= 0) { this.texts.release(i); return; }
      t.y += t.vy * dt;
      t.vy *= Math.exp(-2 * dt);
    });
    this.shakeMag = Math.max(0, this.shakeMag - 60 * dt * (this.shakeMag * 0.12 + 1));
    this.hitStopT = Math.max(0, this.hitStopT - dt);
    this.flashT = Math.max(0, this.flashT - dt);
    this.vignette = Math.max(0, this.vignette - 1.6 * dt);
  },

  updateShake() {
    if (this.shakeMag > 0.1) {
      this.shakeX = rand(-1, 1) * this.shakeMag;
      this.shakeY = rand(-1, 1) * this.shakeMag;
    } else {
      this.shakeX = 0; this.shakeY = 0;
      this.shakeMag = 0;
    }
  },

  draw(ctx) {
    this.parts.forEach(p => {
      const t = p.life / p.maxLife;
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      if (p.type === 0) {
        const s = p.size * (0.4 + t * 0.6);
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
      } else if (p.type === 1) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, p.size * t);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
        ctx.stroke();
      } else if (p.type === 2) {
        const r = p.size * (1 - t);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w || 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, r), 0, TAU);
        ctx.stroke();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
        ctx.restore();
      }
    });
    ctx.globalAlpha = 1;

    this.texts.forEach(t => {
      const k = t.life / t.maxLife;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      drawText(ctx, t.text, t.x, t.y, t.size, t.color, 'center', true);
    });
    ctx.globalAlpha = 1;
  },
};

// ============================================================
// Entities: player, bullets, enemies, boss, pickups.
// Plain objects, pooled where they spawn constantly.
// ============================================================

// ------------------------------------------------------------
// Player
// ------------------------------------------------------------
const Player = {
  x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0, r: CFG.playerRadius, rest: 0.2,
  hp: 100, maxHp: 100,
  aimX: 1, aimY: 0, aimAng: 0,
  fireCd: 0, dashCd: 0, dashing: 0, dashVX: 0, dashVY: 0,
  iframes: 0, weapon: 'blaster',
  shield: 0, shieldRecharge: 0,
  level: 1, xp: 0, xpNext: 0,
  kills: 0, score: 0, credits: 0,
  combo: 0, comboT: 0,
  stats: null,
  drones: [], // {ang, cd}

  reset(stats) {
    this.stats = stats;
    this.x = CFG.arenaW / 2;
    this.y = CFG.arenaH / 2;
    this.vx = 0; this.vy = 0;
    this.r = CFG.playerRadius;
    this.maxHp = stats.maxHp;
    this.hp = stats.maxHp;
    this.fireCd = 0; this.dashCd = 0; this.dashing = 0;
    this.iframes = 1.0;
    this.weapon = stats.startWeapon;
    this.shield = stats.shieldMax;
    this.shieldRecharge = 0;
    this.level = 1; this.xp = 0;
    this.xpNext = xpForLevel(1);
    this.kills = 0; this.score = 0; this.credits = 0;
    this.combo = 0; this.comboT = 0;
    this._upgradeCounts = {};
    this.drones = [];
    for (let i = 0; i < stats.drones; i++) {
      this.drones.push({ ang: (i / stats.drones) * TAU, cd: 0 });
    }
  },

  update(dt, input) {
    const s = this.stats;

    // Movement: acceleration + exponential friction feels crisp.
    let ix = input.moveX, iy = input.moveY;
    const il = Math.hypot(ix, iy);
    if (il > 1) { ix /= il; iy /= il; }
    if (this.dashing > 0) {
      this.dashing -= dt;
      this.vx = this.dashVX;
      this.vy = this.dashVY;
      FX.trail(this.x, this.y, CFG.colors.dash, 5);
    } else {
      const speed = CFG.playerSpeed * s.speedMult;
      this.vx += ix * CFG.playerAccel * dt;
      this.vy += iy * CFG.playerAccel * dt;
      const dampK = il > 0.01 ? CFG.playerFriction : CFG.playerFriction * 1.6;
      this.vx = damp(this.vx, ix * speed, dampK, dt);
      this.vy = damp(this.vy, iy * speed, dampK, dt);
    }
    // Physics engine handles integration, walls and obstacle response.
    Physics.integrate(this, dt, { substeps: 2, knockDecay: 6.0 });

    // Aim: mouse position or right stick.
    if (input.aiming) {
      this.aimAng = Math.atan2(input.aimY - this.y, input.aimX - this.x);
    } else if (il > 0.1) {
      // Auto-aim fallback when not aiming manually.
      const t = this.nearestEnemy();
      if (t) this.aimAng = ang(this.x, this.y, t.x, t.y);
      else this.aimAng = Math.atan2(iy, ix);
    }

    // Timers.
    this.fireCd -= dt;
    this.dashCd -= dt;
    this.iframes = Math.max(0, this.iframes - dt);
    this.comboT -= dt;
    if (this.comboT <= 0 && this.combo > 0) { this.combo = 0; }

    // Regen.
    if (s.regen > 0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + s.regen * dt);
    }

    // Shield recharge: one block back every 9 seconds.
    if (this.shield < s.shieldMax) {
      this.shieldRecharge += dt;
      if (this.shieldRecharge >= 9) {
        this.shieldRecharge = 0;
        this.shield++;
        FX.ring(this.x, this.y, CFG.colors.player, 40, 0.4, 2);
      }
    }

    // Dash.
    if (input.dash && this.dashCd <= 0 && this.dashing <= 0) {
      input.dash = false;
      let dx = ix, dy = iy;
      if (Math.hypot(dx, dy) < 0.1) { dx = Math.cos(this.aimAng); dy = Math.sin(this.aimAng); }
      const l = Math.hypot(dx, dy) || 1;
      this.dashVX = (dx / l) * CFG.dashSpeed;
      this.dashVY = (dy / l) * CFG.dashSpeed;
      this.dashing = CFG.dashTime;
      this.dashCd = CFG.dashCooldown * s.dashCdMult;
      this.iframes = Math.max(this.iframes, CFG.dashIframes);
      AudioSys.dash();
      FX.ring(this.x, this.y, CFG.colors.dash, 46, 0.3, 3);
    }

    // Fire.
    if (input.firing && this.fireCd <= 0) {
      this.fire();
    }

    // Orbit drones fire on their own cadence.
    for (const d of this.drones) {
      d.ang += 1.6 * dt;
      d.cd -= dt;
      if (d.cd <= 0) {
        const dx = this.x + Math.cos(d.ang) * 46;
        const dy = this.y + Math.sin(d.ang) * 46;
        const t = this.nearestEnemy();
        if (t) {
          const a = ang(dx, dy, t.x, t.y);
          spawnBullet(dx, dy, a, 700, 8, 4, s.dmgMult * 6 * (chance(s.critChance) ? s.critMult : 1), 0, CFG.colors.gem, 0, 0);
          d.cd = 0.8;
        }
      }
    }
  },

  nearestEnemy() {
    let best = null, bd = 1e12;
    for (let i = 0; i < Enemies.list.count; i++) {
      const e = Enemies.list.items[i];
      const d = dist2(this.x, this.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best && Boss.active) best = Boss;
    return best;
  },

  fire() {
    const s = this.stats;
    const w = WEAPONS[this.weapon];
    this.fireCd = w.cooldown / s.rateMult;
    const shots = w.count + s.extraShots;
    for (let i = 0; i < shots; i++) {
      const spread = w.spread * (shots > 1 ? 1 : 0.5);
      const off = shots > 1 ? (i / (shots - 1) - 0.5) * spread * 2 : 0;
      const a = this.aimAng + off + rand(-0.02, 0.02);
      const dmg = w.damage * s.dmgMult * (chance(s.critChance) ? s.critMult : 1);
      spawnBullet(
        this.x + Math.cos(a) * (this.r + 8),
        this.y + Math.sin(a) * (this.r + 8),
        a, w.speed * rand(0.95, 1.05),
        dmg, w.size, CFG.colors[w.color],
        w.pierce + s.pierce, w.knock, w.homing, w.blast, w.blastDmg, w.lifetime
      );
    }
    if (this.weapon === 'shotgun') AudioSys.shotgun();
    else if (this.weapon === 'laser') AudioSys.laser();
    else if (this.weapon === 'missiles') AudioSys.missile();
    else AudioSys.shoot();
    // Muzzle flash + recoil kick.
    FX.spawn(this.x + Math.cos(this.aimAng) * 20, this.y + Math.sin(this.aimAng) * 20,
      { color: CFG.colors[w.color], size: 8, life: 0.08, type: 0 });
    Physics.impulse(this, -Math.cos(this.aimAng) * (w.knock || 60) * 0.30,
      -Math.sin(this.aimAng) * (w.knock || 60) * 0.30);
  },

  gainXp(v) {
    this.xp += v * this.stats.xpMult;
    if (this.xp >= this.xpNext) {
      this.xp -= this.xpNext;
      this.level++;
      this.xpNext = xpForLevel(this.level);
      Game.onLevelUp();
    }
  },

  takeDamage(amount, sourceX, sourceY) {
    if (this.iframes > 0) return false;
    if (this.shield > 0) {
      this.shield--;
      this.iframes = 0.5;
      AudioSys.hit();
      FX.ring(this.x, this.y, CFG.colors.player, 60, 0.35, 4);
      FX.text(this.x, this.y - 26, 'BLOCKED', CFG.colors.player, 13);
      return false;
    }
    this.hp -= amount;
    this.iframes = CFG.iframeTime;
    this.combo = 0;
    AudioSys.hurt();
    FX.shake(9);
    FX.flash('#ff2d4d', 0.16);
    FX.pulseVignette(0.5);
    FX.hitStop(0.05);
    FX.burst(this.x, this.y, '#ff5c7a', 14, 220, 4, 0.4);
    if (sourceX !== undefined) {
      // Knockback rides the physics impulse channel now.
      Physics.knockFrom(this, sourceX, sourceY, 210);
    }
    if (this.hp <= 0) {
      if (this.stats.revives > 0) {
        this.stats.revives--;
        this.hp = this.maxHp * 0.5;
        this.iframes = 2.0;
        AudioSys.levelup();
        FX.ring(this.x, this.y, CFG.colors.gold, 220, 0.8, 6);
        FX.text(this.x, this.y - 40, 'SECOND WIND!', CFG.colors.gold, 20);
        FX.shake(16);
        return false;
      }
      this.hp = 0;
      Game.onPlayerDeath();
    }
    return true;
  },

  draw(ctx) {
    const blink = this.iframes > 0 && Math.floor(this.iframes * 20) % 2 === 0;
    if (blink) ctx.globalAlpha = 0.4;

    // Shadow/glow disc.
    ctx.fillStyle = 'rgba(78,241,255,0.10)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 7, 0, TAU);
    ctx.fill();

    // Body: ship triangle pointing at aim.
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.aimAng);
    // Squash on dash for stretch juice.
    const st = this.dashing > 0 ? 1.45 : 1;
    ctx.scale(st, 2 - st);
    ctx.fillStyle = CFG.colors.player;
    ctx.strokeStyle = CFG.colors.playerCore;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.r + 4, 0);
    ctx.lineTo(-this.r, this.r * 0.8);
    ctx.lineTo(-this.r * 0.45, 0);
    ctx.lineTo(-this.r, -this.r * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Engine glow scales with speed.
    const spd = Math.hypot(this.vx, this.vy);
    ctx.fillStyle = 'rgba(167,255,94,' + Math.min(0.9, spd / 400) + ')';
    ctx.beginPath();
    ctx.arc(-this.r * 0.9, 0, 4 + spd * 0.012, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Shield bubbles.
    if (this.shield > 0) {
      ctx.strokeStyle = 'rgba(78,241,255,0.6)';
      ctx.lineWidth = 2;
      for (let i = 0; i < this.shield; i++) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r + 9 + i * 5, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },
};

function xpForLevel(n) { return Math.round(CFG.xpBase * Math.pow(n, CFG.xpExp)); }

// ------------------------------------------------------------
// Bullet pool (player + enemy share one pool, team flag).
// ------------------------------------------------------------
const Bullets = {
  list: null,
  hash: null,
  near: [],

  init() {
    this.list = new Pool(() => ({
      active: false, x: 0, y: 0, vx: 0, vy: 0, r: 4, dmg: 0,
      team: 0, life: 0, pierce: 0, homing: 0, blast: 0, blastDmg: 0,
      color: '#fff', knock: 0, hitSet: null,
    }), 700);
    this.hash = new SpatialHash(90);
  },

  reset() { this.list.clear(); },

  fire(x, y, angA, speed, dmg, size, color, pierce, knock, homing, blast, blastDmg, life, team) {
    const b = this.list.get();
    b.active = true;
    b.x = x; b.y = y;
    b.vx = Math.cos(angA) * speed;
    b.vy = Math.sin(angA) * speed;
    b.r = size; b.dmg = dmg;
    b.team = team || 0;
    b.life = life || 1.4;
    b.pierce = pierce || 0;
    b.homing = homing || 0;
    b.blast = blast || 0;
    b.blastDmg = blastDmg || 0;
    b.color = color;
    b.knock = knock || 0;
    b.hitSet = b.pierce > 0 ? new Set() : null;
    return b;
  },

  explode(b) {
    FX.burst(b.x, b.y, b.color, 16, 260, 5, 0.5);
    FX.ring(b.x, b.y, b.color, b.blast, 0.3, 4);
    AudioSys.explode(false);
    FX.shake(4);
    const q = this.hash.query(b.x, b.y, b.blast, this.near);
    for (const e of q) {
      if (!e.alive || e.type === 'bullet') continue;
      if (dist2(b.x, b.y, e.x, e.y) <= (b.blast + e.r) * (b.blast + e.r)) {
        if (e === Boss) Boss.damage(b.blastDmg, b.x, b.y);
        else if (e.team === 1) Enemies.damage(e, b.blastDmg, b.x, b.y);
      }
    }
  },

  update(dt) {
    // Rebuild the broad-phase hash over enemies + boss once per frame.
    this.hash.clear();
    for (let i = 0; i < Enemies.list.count; i++) {
      const e = Enemies.list.items[i];
      this.hash.insert(e);
    }
    if (Boss.active) this.hash.insert(Boss);

    this.list.forEach((b, i) => {
      b.life -= dt;
      if (b.life <= 0) {
        if (b.blast > 0 && b.team === 0) this.explode(b);
        this.list.release(i);
        return;
      }
      // Homing steer toward nearest enemy.
      if (b.homing > 0 && b.team === 0) {
        const t = Player.nearestEnemy();
        if (t) {
          const want = ang(b.x, b.y, t.x, t.y);
          const cur = Math.atan2(b.vy, b.vx);
          const na = cur + clamp(normAng(want - cur), -b.homing * dt, b.homing * dt);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * sp;
          b.vy = Math.sin(na) * sp;
        }
      }
      const px = b.x, py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -40 || b.x > CFG.arenaW + 40 || b.y < -40 || b.y > CFG.arenaH + 40) {
        this.list.release(i);
        return;
      }
      if (World.segHitsObstacle(px, py, b.x, b.y, b.r)) {
        FX.burst(b.x, b.y, b.color, 4, 120, 3, 0.25);
        if (b.blast > 0 && b.team === 0) this.explode(b);
        this.list.release(i);
        return;
      }

      if (b.team === 0) {
        // Player bullet vs enemies.
        const q = this.hash.query((b.x + px) / 2, (b.y + py) / 2,
          b.r + 34 + Math.hypot(b.vx, b.vy) * dt * 0.5, this.near);
        for (const e of q) {
          if (!e.alive) continue;
          if (b.hitSet && b.hitSet.has(e)) continue;
          if (!Physics.segCircle(px, py, b.x, b.y, e.x, e.y, e.r + b.r)) continue;
          if (e === Boss) Boss.damage(b.dmg, b.x, b.y);
          else Enemies.damage(e, b.dmg, b.x, b.y);
          // Knockback.
          const ka = Math.atan2(b.vy, b.vx);
          const kr = (b.knock || 60) / (e.mass || 1);
          Physics.impulse(e, Math.cos(ka) * kr, Math.sin(ka) * kr);
          FX.burst(b.x, b.y, b.color, 5, 160, 3, 0.3);
          if (b.pierce > 0) {
            b.pierce--;
            if (b.hitSet) b.hitSet.add(e);
          } else {
            if (b.blast > 0) this.explode(b);
            this.list.release(i);
            break;
          }
        }
      } else {
        // Enemy bullet vs player.
        if (Physics.segCircle(px, py, b.x, b.y, Player.x, Player.y, Player.r + b.r)) {
          Player.takeDamage(b.dmg, b.x, b.y);
          FX.burst(b.x, b.y, CFG.colors.ebullet, 6, 140, 3, 0.3);
          this.list.release(i);
        }
      }
    });
  },

  draw(ctx) {
    this.list.forEach(b => {
      ctx.fillStyle = b.color;
      if (b.team === 1) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,92,122,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 3, 0, TAU);
        ctx.stroke();
      } else {
        const a = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(a);
        ctx.fillRect(-b.r * 2, -b.r * 0.5, b.r * 3, b.r);
        ctx.restore();
      }
    });
  },
};

function spawnBullet(x, y, a, speed, dmg, size, color, pierce, knock, homing, blast, blastDmg, life, team) {
  return Bullets.fire(x, y, a, speed, dmg, size, color, pierce, knock, homing, blast, blastDmg, life, team);
}

// ------------------------------------------------------------
// Enemies. One pool, type field switches behavior.
// ------------------------------------------------------------
const Enemies = {
  list: null,
  hash: null,
  near: [],

  init() {
    this.list = new Pool(() => ({
      active: false, alive: false, type: '', x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0,
      r: 10, hp: 1, maxHp: 1, speed: 100, damage: 10, score: 10, xp: 1,
      mass: 1, color: '#fff', team: 1, t: 0, state: 'chase',
      timer: 0, fireT: 0, elite: null, flash: 0, slowT: 0,
      dartAng: 0, fused: false, lifesteal: 0, deathBlast: 0, deathBlastDmg: 0,
    }), 200);
    this.hash = new SpatialHash(80);
  },

  reset() { this.list.clear(); },

  aliveCount() {
    let n = 0;
    for (let i = 0; i < this.list.count; i++) if (this.list.items[i].alive) n++;
    return n;
  },

  spawn(typeName, x, y, scale, elite) {
    const def = ENEMY_TYPES[typeName];
    const e = this.list.get();
    e.active = true; e.alive = true;
    e.type = typeName;
    e.x = x; e.y = y; e.vx = 0; e.vy = 0;
    e.r = def.radius * (elite && elite.mods.radius ? elite.mods.radius : 1);
    e.maxHp = def.hp * scale.hp * (elite ? elite.mods.hp || 1 : 1);
    e.hp = e.maxHp;
    e.speed = def.speed * scale.speed * (elite && elite.mods.speed ? elite.mods.speed : 1) * rand(0.9, 1.1);
    e.damage = def.damage * scale.dmg * (elite && elite.mods.damage ? elite.mods.damage : 1);
    e.score = def.score * (elite ? 3 : 1);
    e.xp = def.xp * (elite ? 3 : 1);
    e.mass = def.mass;
    e.color = elite ? elite.tint : CFG.colors[def.color];
    e.team = 1;
    e.t = rand(0, TAU);
    e.state = 'chase';
    e.timer = 0;
    e.fireT = rand(0.5, def.fireCd || 1);
    e.flash = 0;
    e.slowT = 0;
    e.elite = elite ? elite.name : null;
    e.lifesteal = elite && elite.mods.lifesteal ? elite.mods.lifesteal : 0;
    e.deathBlast = elite && elite.mods.deathBlast ? elite.mods.deathBlast : 0;
    e.deathBlastDmg = elite && elite.mods.deathBlastDmg ? elite.mods.deathBlastDmg : 0;
    e.dartAng = 0;
    e.fused = false;
    return e;
  },

  damage(e, amount, srcX, srcY) {
    e.hp -= amount;
    e.flash = 0.09;
    if (amount >= 25) { AudioSys.crit(); FX.text(e.x, e.y - e.r - 8, Math.round(amount), CFG.colors.gold, 15); }
    else { AudioSys.hit(); }
    if (srcX !== undefined && e.type !== 'bomber') {
      Physics.knockFrom(e, srcX, srcY, 70 / (e.mass || 1));
    }
    if (e.hp <= 0) this.kill(e);
  },

  kill(e) {
    e.alive = false;
    Player.kills++;
    Player.combo++;
    Player.comboT = CFG.comboWindow;
    const mult = 1 + Math.min(CFG.comboMaxMult - 1, Player.combo * 0.05);
    const pts = Math.round(e.score * mult);
    Player.score += pts;
    const creds = Math.round(e.score * 0.4 * Player.stats.goldMult);
    Player.credits += creds;

    AudioSys.explode(e.r > 24);
    FX.burst(e.x, e.y, e.color, e.r > 24 ? 26 : 12, e.r > 24 ? 320 : 200, e.r > 24 ? 5 : 3.5, 0.5);
    FX.ring(e.x, e.y, e.color, e.r * 3, 0.3, 3);
    if (e.r > 24) { FX.shake(7); FX.hitStop(0.045); }
    else FX.shake(2.5);
    FX.text(e.x, e.y - e.r - 6, '+' + pts, mult > 1.5 ? CFG.colors.gold : CFG.colors.ui, 13);

    // Drop gems and occasional pickups.
    const gems = clamp(Math.round(e.xp / 2) + 1, 1, 6);
    for (let i = 0; i < gems; i++) {
      Pickups.spawnGem(e.x + rand(-12, 12), e.y + rand(-12, 12), Math.max(1, Math.round(e.xp / gems)));
    }
    if (chance(0.03)) Pickups.spawnHealth(e.x, e.y);
    if (chance(0.02)) Pickups.spawnWeapon(e.x, e.y);

    // Volatile elite death blast.
    if (e.deathBlast > 0) {
      FX.ring(e.x, e.y, '#fa2', e.deathBlast, 0.4, 5);
      if (dist2(e.x, e.y, Player.x, Player.y) < (e.deathBlast + Player.r) ** 2) {
        Player.takeDamage(e.deathBlastDmg, e.x, e.y);
      }
    }

    // Splitter children.
    const def = ENEMY_TYPES[e.type];
    if (def.splits && e.type === 'splitter') {
      for (let i = 0; i < def.splits; i++) {
        const a = (i / def.splits) * TAU + rand(0, 1);
        this.spawn(def.childType, e.x + Math.cos(a) * 18, e.y + Math.sin(a) * 18,
          { hp: 1, dmg: 1, speed: 1 }, null);
      }
    }
    Game.waveKill();
  },

  update(dt) {
    this.hash.clear();
    for (let i = 0; i < this.list.count; i++) {
      const e = this.list.items[i];
      if (e.alive) this.hash.insert(e);
    }

    this.list.forEach((e, i) => {
      if (!e.alive) { this.list.release(i); return; }
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      e.slowT = Math.max(0, e.slowT - dt);

      // Chrono field slows nearby enemies.
      let spdMult = 1;
      if (Player.stats.chrono > 0 &&
          dist2(e.x, e.y, Player.x, Player.y) < 260 * 260) {
        spdMult = 1 - Player.stats.chrono;
      }

      AI.update(e, dt * spdMult);
      Physics.integrate(e, dt, { substeps: 2, knockDecay: 5.0 });

      // Touch damage to the player.
      const def = ENEMY_TYPES[e.type];
      if (def.touch !== false && circleHit(e.x, e.y, e.r, Player.x, Player.y, Player.r)) {
        const hit = Player.takeDamage(e.damage, e.x, e.y);
        // Thorns reflect.
        if (Player.stats.thorns > 0) this.damage(e, Player.stats.thorns, e.x, e.y);
        if (hit && e.lifesteal > 0) {
          e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.lifesteal);
        }
        // Bounce apart so enemies don't sit inside the player.
        const a = ang(Player.x, Player.y, e.x, e.y);
        Physics.impulse(e, Math.cos(a) * 150, Math.sin(a) * 150);
      }

      // Bombers arm and detonate.
      if (e.type === 'bomber' && !e.fused &&
          dist2(e.x, e.y, Player.x, Player.y) < 80 * 80) {
        e.fused = true;
        e.timer = def.fuse;
      }
      if (e.type === 'bomber' && e.fused) {
        e.timer -= dt;
        if (e.timer <= 0) {
          FX.ring(e.x, e.y, e.color, def.blast, 0.35, 6);
          AudioSys.explode(true);
          FX.shake(12);
          if (dist2(e.x, e.y, Player.x, Player.y) < (def.blast + Player.r) ** 2) {
            Player.takeDamage(def.blastDmg * (1 + (Waves.wave - 1) * 0.03), e.x, e.y);
          }
          e.alive = false;
          this.kill(e);
          return;
        }
      }
    });
    // Physics crowd separation so enemies never stack into one blob.
    Physics.resolvePairs(this.list.items, this.list.count);
  },

  draw(ctx) {
    this.list.forEach(e => {
      if (!e.alive) return;
      const def = ENEMY_TYPES[e.type];
      ctx.save();
      ctx.translate(e.x, e.y);
      const wob = 1 + Math.sin(e.t * 6) * 0.06;
      ctx.scale(wob, 2 - wob);
      if (e.flash > 0) ctx.fillStyle = '#ffffff';
      else ctx.fillStyle = e.color;

      switch (e.type) {
        case 'grunt':
          ctx.rotate(e.t * 2);
          ctx.fillRect(-e.r, -e.r, e.r * 2, e.r * 2);
          break;
        case 'darter': {
          const a = Math.atan2(e.vy, e.vx);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(e.r * 1.6, 0);
          ctx.lineTo(-e.r, e.r);
          ctx.lineTo(-e.r, -e.r);
          ctx.closePath();
          ctx.fill();
          break;
        }
        case 'spitter':
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#04040c';
          ctx.beginPath();
          ctx.arc(0, 0, e.r * 0.45, 0, TAU);
          ctx.fill();
          break;
        case 'splitter':
        case 'shard':
          ctx.rotate(e.t);
          ctx.beginPath();
          const sides = e.type === 'splitter' ? 6 : 3;
          for (let s = 0; s <= sides; s++) {
            const a2 = (s / sides) * TAU;
            const px = Math.cos(a2) * e.r, py = Math.sin(a2) * e.r;
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          break;
        case 'orbiter':
          ctx.rotate(Math.atan2(e.vy, e.vx));
          ctx.fillRect(-e.r, -e.r * 0.5, e.r * 2, e.r);
          ctx.fillRect(-e.r * 0.4, -e.r, e.r * 0.8, e.r * 2);
          break;
        case 'brute':
          ctx.rotate(e.t * 0.6);
          ctx.fillRect(-e.r, -e.r, e.r * 2, e.r * 2);
          ctx.fillStyle = '#04040c';
          ctx.fillRect(-e.r * 0.5, -e.r * 0.5, e.r, e.r);
          ctx.fillStyle = e.color;
          ctx.fillRect(-e.r * 0.25, -e.r * 0.25, e.r * 0.5, e.r * 0.5);
          break;
        case 'swarm':
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, TAU);
          ctx.fill();
          break;
        case 'bomber':
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, TAU);
          ctx.fill();
          if (e.fused) {
            const blink = Math.sin(e.t * 40) > 0;
            ctx.strokeStyle = blink ? '#ffffff' : 'rgba(255,45,85,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, e.r + 6, 0, TAU);
            ctx.stroke();
          }
          break;
      }
      ctx.restore();

      // Elite name tag.
      if (e.elite) {
        drawText(ctx, e.elite, e.x, e.y - e.r - 10, 10, e.color, 'center', true);
      }
      // HP pips for tough enemies.
      if (e.maxHp >= 40 && e.hp < e.maxHp) {
        const w = e.r * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - w / 2, e.y - e.r - 6, w, 3);
        ctx.fillStyle = CFG.colors.hp;
        ctx.fillRect(e.x - w / 2, e.y - e.r - 6, w * (e.hp / e.maxHp), 3);
      }
    });
  },
};

// ------------------------------------------------------------
// Boss. Larger enemy with phases and telegraphed attacks.
// ------------------------------------------------------------
const Boss = {
  active: false, x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0, r: 46,
  hp: 1, maxHp: 1, name: '', color: '#fff',
  def: null, phase: 1, t: 0, flash: 0,
  ringT: 0, dashT: 0, dashWind: 0, summonT: 0, spawnT: 0,
  score: 0, xp: 0, damage: 20, mass: 10, rest: 0.08, alive: false,

  spawn(tier, scale) {
    const idx = (tier - 1) % BOSSES.length;
    const def = BOSSES[idx];
    const loops = Math.floor((tier - 1) / BOSSES.length);
    this.def = def;
    this.active = true; this.alive = true;
    this.x = CFG.arenaW / 2;
    this.y = 160;
    this.vx = 0; this.vy = 0;
    this.r = def.radius;
    this.maxHp = def.hp * scale.hp * (1 + loops * 1.1);
    this.hp = this.maxHp;
    this.speed = def.speed * (1 + loops * 0.15);
    this.damage = def.damage * (1 + loops * 0.3);
    this.name = def.name + (loops > 0 ? ' MK' + (loops + 1) : '');
    this.color = CFG.colors[def.color];
    this.phase = 1;
    this.t = 0; this.flash = 0;
    this.ringT = 2.5; this.dashT = 5; this.dashWind = 0; this.summonT = 6;
    this.score = def.score * (1 + loops);
    this.xp = def.xp * (1 + loops);
    AudioSys.bossRoar();
    FX.shake(18);
    FX.flash(this.color, 0.3);
  },

  damage(amount, srcX, srcY) {
    this.hp -= amount;
    this.flash = 0.07;
    if (amount >= 25) FX.text(this.x + rand(-20, 20), this.y - this.r - 10, Math.round(amount), CFG.colors.gold, 16);
    if (srcX !== undefined) {
      // Bosses barely budge.
      const a = ang(srcX, srcY, this.x, this.y);
      Physics.impulse(this, Math.cos(a) * 8, Math.sin(a) * 8);
    }
    const frac = this.hp / this.maxHp;
    const def = this.def;
    const wantPhase = frac > 0.66 ? 1 : frac > 0.33 ? 2 : 3;
    if (wantPhase > this.phase && wantPhase <= def.phases) {
      this.phase = wantPhase;
      AudioSys.bossRoar();
      FX.ring(this.x, this.y, this.color, 260, 0.8, 8);
      FX.shake(14);
      FX.hitStop(0.12);
      FX.text(this.x, this.y - this.r - 30, 'PHASE ' + this.phase, this.color, 24);
      // Phase transition ring attack.
      this.ringAttack(def.ringBullets, def.bulletSpeed * 1.1);
    }
    if (this.hp <= 0) this.die();
  },

  ringAttack(count, speed) {
    const off = rand(0, TAU);
    for (let i = 0; i < count; i++) {
      const a = off + (i / count) * TAU;
      Bullets.fire(this.x, this.y, a, speed, this.def.bulletDmg, 8, CFG.colors.ebullet, 0, 0, 0, 0, 0, 3.2, 1);
    }
    AudioSys.explode(false);
  },

  spiralAttack(t) {
    // Continuous spiral during phase 3+.
    const arms = this.def.phases >= 4 ? 3 : 2;
    for (let k = 0; k < arms; k++) {
      const a = t * 3.2 + (k / arms) * TAU;
      Bullets.fire(this.x, this.y, a, this.def.bulletSpeed * 0.85, this.def.bulletDmg * 0.8, 7, CFG.colors.ebullet, 0, 0, 0, 0, 0, 3.0, 1);
    }
  },

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt);
    const def = this.def;

    // Seek the player, accelerating in later phases.
    const a = ang(this.x, this.y, Player.x, Player.y);
    const sp = this.speed * (1 + (this.phase - 1) * 0.25);
    this.vx = damp(this.vx, Math.cos(a) * sp, 2.2, dt);
    this.vy = damp(this.vy, Math.sin(a) * sp, 2.2, dt);
    Physics.integrate(this, dt, { substeps: 2, knockDecay: 4.0 });

    // Ring bursts on a timer; faster per phase.
    this.ringT -= dt;
    if (this.ringT <= 0) {
      this.ringT = Math.max(1.1, 3.0 - this.phase * 0.45);
      this.ringAttack(def.ringBullets + this.phase * 4, def.bulletSpeed);
      FX.ring(this.x, this.y, this.color, 90, 0.4, 4);
    }
    // Spiral in phase 3+.
    if (this.phase >= 3) this.spiralAttack(this.t);

    // Charge dash with a wind-up telegraph.
    this.dashT -= dt;
    if (this.dashWind > 0) {
      this.dashWind -= dt;
      if (this.dashWind <= 0) {
        const ca = ang(this.x, this.y, Player.x, Player.y);
        this.vx = Math.cos(ca) * 620;
        this.vy = Math.sin(ca) * 620;
        AudioSys.dash();
        FX.shake(8);
      }
    } else if (this.dashT <= 0) {
      this.dashT = def.dashCd * rand(0.85, 1.15);
      this.dashWind = 0.6;
      FX.text(this.x, this.y - this.r - 20, '!', this.color, 30);
    }

    // Summon minions in phase 2+.
    if (this.phase >= 2) {
      this.summonT -= dt;
      if (this.summonT <= 0) {
        this.summonT = 8 - this.phase;
        for (let i = 0; i < def.summonCount; i++) {
          const sa = rand(0, TAU);
          Enemies.spawn(def.summonType,
            clamp(this.x + Math.cos(sa) * 90, 40, CFG.arenaW - 40),
            clamp(this.y + Math.sin(sa) * 90, 40, CFG.arenaH - 40),
            Game.waveScale(), null);
        }
        FX.ring(this.x, this.y, this.color, 130, 0.5, 4);
      }
    }

    // Contact damage.
    if (circleHit(this.x, this.y, this.r, Player.x, Player.y, Player.r)) {
      Player.takeDamage(this.damage, this.x, this.y);
    }
  },

  die() {
    this.active = false; this.alive = false;
    AudioSys.explode(true);
    FX.shake(24);
    FX.hitStop(0.2);
    FX.flash('#ffffff', 0.4);
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        if (Game.state !== 'play') return;
        FX.burst(this.x + rand(-50, 50), this.y + rand(-50, 50), this.color, 30, 380, 6, 0.9);
        AudioSys.explode(true);
      }, i * 130);
    }
    Player.score += Math.round(this.score * (1 + Math.min(CFG.comboMaxMult - 1, Player.combo * 0.05)));
    Player.credits += Math.round(this.score * 0.5 * Player.stats.goldMult);
    for (let i = 0; i < 14; i++) Pickups.spawnGem(this.x + rand(-40, 40), this.y + rand(-40, 40), 8);
    Pickups.spawnHealth(this.x + rand(-30, 30), this.y + rand(-30, 30));
    Pickups.spawnWeapon(this.x + rand(-30, 30), this.y + rand(-30, 30));
    FX.text(this.x, this.y, '+' + Math.round(this.score), CFG.colors.gold, 26);
    Game.onBossKill();
  },

  draw(ctx) {
    if (!this.active) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    // Rotating outer shell.
    ctx.rotate(this.t * 0.8);
    ctx.fillStyle = this.flash > 0 ? '#ffffff' : this.color;
    const sides = 7;
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a2 = (i / sides) * TAU;
      const rr = this.r * (1 + Math.sin(this.t * 5 + i) * 0.05);
      if (i === 0) ctx.moveTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
      else ctx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.rotate(-this.t * 0.8);
    // Inner core shows phase.
    ctx.fillStyle = '#04040c';
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.55, 0, TAU);
    ctx.fill();
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.3 * (0.6 + this.phase * 0.15) + Math.sin(this.t * 8) * 3, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Wind-up telegraph line.
    if (this.dashWind > 0) {
      const a = ang(this.x, this.y, Player.x, Player.y);
      ctx.strokeStyle = 'rgba(255,77,109,' + (0.25 + 0.5 * Math.abs(Math.sin(this.t * 20))) + ')';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + Math.cos(a) * 800, this.y + Math.sin(a) * 800);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  },
};

// ------------------------------------------------------------
// Pickups: XP gems, health, weapon crates.
// ------------------------------------------------------------
const Pickups = {
  gems: [],
  items: [],

  reset() { this.gems.length = 0; this.items.length = 0; },

  spawnGem(x, y, value) {
    if (this.gems.length > 260) this.gems.shift();
    this.gems.push({ x, y, vx: rand(-40, 40), vy: rand(-40, 40), v: value, life: CFG.gemLifetime, t: rand(0, TAU) });
  },
  spawnHealth(x, y) {
    this.items.push({ kind: 'health', x, y, t: 0, life: 26 });
  },
  spawnWeapon(x, y) {
    const w = pick(['shotgun', 'laser', 'missiles']);
    this.items.push({ kind: 'weapon', weapon: w, x, y, t: 0, life: 30 });
  },

  update(dt) {
    const magnet = CFG.pickupMagnet * Player.stats.magnetMult;
    const m2 = magnet * magnet;
    for (let i = this.gems.length - 1; i >= 0; i--) {
      const g = this.gems[i];
      g.life -= dt;
      if (g.life <= 0) { this.gems.splice(i, 1); continue; }
      g.t += dt;
      const d2 = dist2(g.x, g.y, Player.x, Player.y);
      if (d2 < m2) {
        // Accelerate toward the player, faster when closer.
        const a = ang(g.x, g.y, Player.x, Player.y);
        const pull = 560 * (1 - Math.sqrt(d2) / magnet) + 220;
        g.vx = damp(g.vx, Math.cos(a) * pull, 6, dt);
        g.vy = damp(g.vy, Math.sin(a) * pull, 6, dt);
      } else {
        g.vx *= Math.exp(-2.5 * dt);
        g.vy *= Math.exp(-2.5 * dt);
      }
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      if (d2 < (Player.r + 10) * (Player.r + 10)) {
        Player.gainXp(g.v);
        AudioSys.gem();
        FX.burst(g.x, g.y, CFG.colors.gem, 3, 90, 2, 0.25);
        this.gems.splice(i, 1);
      }
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.life -= dt;
      it.t += dt;
      if (it.life <= 0) { this.items.splice(i, 1); continue; }
      if (dist2(it.x, it.y, Player.x, Player.y) < (Player.r + 16) * (Player.r + 16)) {
        if (it.kind === 'health') {
          Player.hp = Math.min(Player.maxHp, Player.hp + 30);
          AudioSys.pickup();
          FX.text(it.x, it.y - 12, '+30 HP', CFG.colors.hp, 15);
          FX.ring(it.x, it.y, CFG.colors.hp, 40, 0.4, 3);
        } else {
          Player.weapon = it.weapon;
          AudioSys.buy();
          FX.text(it.x, it.y - 12, WEAPONS[it.weapon].name, CFG.colors.gold, 14);
          FX.ring(it.x, it.y, CFG.colors.gold, 50, 0.5, 3);
        }
        this.items.splice(i, 1);
      }
    }
  },

  draw(ctx) {
    for (const g of this.gems) {
      const blinkOut = g.life < 3 && Math.floor(g.life * 6) % 2 === 0;
      if (blinkOut) continue;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.t * 2);
      ctx.fillStyle = CFG.colors.gem;
      ctx.fillRect(-3, -3, 6, 6);
      ctx.restore();
    }
    for (const it of this.items) {
      const bob = Math.sin(it.t * 4) * 3;
      ctx.save();
      ctx.translate(it.x, it.y + bob);
      if (it.kind === 'health') {
        ctx.fillStyle = CFG.colors.hp;
        ctx.fillRect(-8, -3, 16, 6);
        ctx.fillRect(-3, -8, 6, 16);
      } else {
        ctx.fillStyle = CFG.colors.gold;
        ctx.fillRect(-9, -7, 18, 14);
        ctx.fillStyle = '#04040c';
        ctx.fillRect(-6, -4, 12, 8);
        ctx.fillStyle = CFG.colors.gold;
        ctx.fillRect(-3, -2, 6, 4);
      }
      ctx.restore();
    }
  },
};

// ============================================================
// AI: steering behaviors + per-type decision logic.
// ============================================================
const AI = {
  steer: { x: 0, y: 0 },

  update(e, dt) {
    const def = ENEMY_TYPES[e.type];
    const s = AI.steer;
    s.x = 0; s.y = 0;

    switch (def.behavior) {
      case 'chase': AI.chase(e, dt); break;
      case 'dart': AI.dart(e, dt); break;
      case 'kite': AI.kite(e, def, dt); break;
      case 'orbit': AI.orbit(e, def, dt); break;
      case 'boid': AI.boid(e, def, dt); break;
      case 'kamikaze': AI.chase(e, dt); break;
    }

    // Integrate steering into velocity.
    e.vx = damp(e.vx, s.x * e.speed, 4, dt);
    e.vy = damp(e.vy, s.y * e.speed, 4, dt);
  },

  chase(e, dt) {
    const s = AI.steer;
    const a = ang(e.x, e.y, Player.x, Player.y);
    s.x = Math.cos(a);
    s.y = Math.sin(a);
    AI.separate(e, s, 0.7);
    AI.avoidObstacles(e, s);
  },

  // Darter: telegraph, then rocket at the player.
  dart(e, dt) {
    const def = ENEMY_TYPES[e.type];
    const s = AI.steer;
    if (e.state === 'chase') {
      const a = ang(e.x, e.y, Player.x, Player.y);
      s.x = Math.cos(a) * 0.5;
      s.y = Math.sin(a) * 0.5;
      e.timer += dt;
      const d = dist(e.x, e.y, Player.x, Player.y);
      if (e.timer > def.dartCd && d < 420 && d > 90) {
        e.state = 'windup';
        e.timer = def.dartWind;
        e.dartAng = a;
      }
    } else if (e.state === 'windup') {
      e.timer -= dt;
      // Track the player slowly during wind-up so it stays fair.
      e.dartAng = e.dartAng + clamp(normAng(ang(e.x, e.y, Player.x, Player.y) - e.dartAng), -1.6 * dt, 1.6 * dt);
      if (e.timer <= 0) {
        e.state = 'dash';
        e.timer = 0.42;
        e.vx = Math.cos(e.dartAng) * def.dartSpeed;
        e.vy = Math.sin(e.dartAng) * def.dartSpeed;
        FX.trail(e.x, e.y, e.color, 4);
      }
    } else {
      e.timer -= dt;
      FX.trail(e.x, e.y, e.color, 3);
      if (e.timer <= 0) { e.state = 'chase'; e.timer = rand(0, 0.6); }
      s.x = 0; s.y = 0; // ballistic during the dash
      return;
    }
    AI.separate(e, s, 0.5);
  },

  // Kite: hold at preferred distance, strafe, and fire.
  kite(e, def, dt) {
    const s = AI.steer;
    const d = dist(e.x, e.y, Player.x, Player.y);
    const a = ang(e.x, e.y, Player.x, Player.y);
    if (d > def.keepDist * 1.15) {
      s.x = Math.cos(a); s.y = Math.sin(a);
    } else if (d < def.keepDist * 0.8) {
      s.x = -Math.cos(a); s.y = -Math.sin(a);
    } else {
      // Strafe sideways.
      const perp = a + Math.PI / 2 * (e.t % 20 < 10 ? 1 : -1);
      s.x = Math.cos(perp) * 0.7;
      s.y = Math.sin(perp) * 0.7;
    }
    AI.separate(e, s, 0.6);
    AI.avoidObstacles(e, s);

    e.fireT -= dt;
    if (e.fireT <= 0 && d < 560) {
      e.fireT = def.fireCd * rand(0.85, 1.15);
      const aim = ang(e.x, e.y, Player.x, Player.y) + rand(-0.08, 0.08);
      Bullets.fire(e.x, e.y, aim, def.bulletSpeed, def.bulletDmg * (1 + (Waves.wave - 1) * 0.03),
        def.bulletSize, CFG.colors.ebullet, 0, 0, 0, 0, 0, 3.5, 1);
      AudioSys.tone(300, 0.08, 'square', 0.04, 140);
      FX.spawn(e.x + Math.cos(aim) * e.r, e.y + Math.sin(aim) * e.r,
        { color: CFG.colors.ebullet, size: 5, life: 0.1 });
    }
  },

  // Orbit: circle the player at range, fire inward.
  orbit(e, def, dt) {
    const s = AI.steer;
    const a = ang(Player.x, Player.y, e.x, e.y); // from player to enemy
    const d = dist(e.x, e.y, Player.x, Player.y);
    // Radial correction plus tangential drive.
    const radial = clamp((def.orbitDist - d) / 100, -1, 1);
    const tangent = def.orbitDir;
    const rx = -Math.cos(a), ry = -Math.sin(a);
    const tx = -Math.sin(a) * tangent, ty = Math.cos(a) * tangent;
    s.x = rx * radial + tx;
    s.y = ry * radial + ty;
    AI.separate(e, s, 0.6);

    e.fireT -= dt;
    if (e.fireT <= 0) {
      e.fireT = def.fireCd * rand(0.85, 1.15);
      const aim = ang(e.x, e.y, Player.x, Player.y) + rand(-0.06, 0.06);
      Bullets.fire(e.x, e.y, aim, def.bulletSpeed, def.bulletDmg * (1 + (Waves.wave - 1) * 0.03),
        def.bulletSize, CFG.colors.ebullet, 0, 0, 0, 0, 0, 3.5, 1);
    }
  },

  // Boid: separation + alignment + cohesion toward the player's gravity.
  boid(e, def, dt) {
    const s = AI.steer;
    let sepX = 0, sepY = 0, cohX = 0, cohY = 0, n = 0;
    const q = Enemies.hash.query(e.x, e.y, 46, Enemies.near);
    for (const o of q) {
      if (o === e || !o.alive) continue;
      const d2 = dist2(e.x, e.y, o.x, o.y);
      if (d2 < 46 * 46 && d2 > 0.01) {
        const d = Math.sqrt(d2);
        sepX += (e.x - o.x) / d;
        sepY += (e.y - o.y) / d;
        cohX += o.vx; cohY += o.vy;
        n++;
      }
    }
    if (n > 0) {
      sepX /= n; sepY /= n;
      cohX /= n; cohY /= n;
    }
    const pa = ang(e.x, e.y, Player.x, Player.y);
    s.x = Math.cos(pa) + sepX * 1.4 + cohX / 220 * 0.3;
    s.y = Math.sin(pa) + sepY * 1.4 + cohY / 220 * 0.3;
    const l = Math.hypot(s.x, s.y) || 1;
    s.x /= l; s.y /= l;
  },

  // Push away from nearby same-type enemies so crowds spread out.
  separate(e, s, weight) {
    let sx = 0, sy = 0;
    const q = Enemies.hash.query(e.x, e.y, e.r * 2.2, Enemies.near);
    for (const o of q) {
      if (o === e || !o.alive) continue;
      const d2 = dist2(e.x, e.y, o.x, o.y);
      const minD = e.r + o.r;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        sx += (e.x - o.x) / d * (1 - d / minD);
        sy += (e.y - o.y) / d * (1 - d / minD);
      }
    }
    s.x += sx * weight;
    s.y += sy * weight;
  },

  // Simple obstacle avoidance: sample ahead, steer around blocks.
  avoidObstacles(e, s) {
    for (const o of World.obstacles) {
      const d = dist(e.x, e.y, o.cx, o.cy);
      const rr = o.br + e.r + 24;
      if (d < rr && d > 0.01) {
        const push = (1 - d / rr) * 1.6;
        s.x += (e.x - o.cx) / d * push;
        s.y += (e.y - o.cy) / d * push;
      }
    }
  },
};

// ============================================================
// World: arena, obstacles, background, camera + wave director.
// ============================================================
const World = {
  obstacles: [],
  bgCanvas: null,
  seed: 1,

  generate(seed) {
    this.seed = seed >>> 0;
    const rng = makeRng(this.seed);
    this.obstacles = [];
    const count = 7 + Math.floor(rng() * 4);
    for (let i = 0; i < count; i++) {
      const w = 60 + rng() * 180;
      const h = 60 + rng() * 180;
      const x = 160 + rng() * (CFG.arenaW - 320 - w);
      const y = 160 + rng() * (CFG.arenaH - 320 - h);
      const cx = CFG.arenaW / 2, cy = CFG.arenaH / 2;
      if (x < cx + 160 && x + w > cx - 160 && y < cy + 160 && y + h > cy - 160) continue;
      this.obstacles.push({ x, y, w, h, cx: x + w / 2, cy: y + h / 2, br: Math.max(w, h) / 2 });
    }
    this.renderBackground();
  },

  collideCircle(ent) {
    for (const o of this.obstacles) {
      const nx = clamp(ent.x, o.x, o.x + o.w);
      const ny = clamp(ent.y, o.y, o.y + o.h);
      const dx = ent.x - nx, dy = ent.y - ny;
      const d2 = dx * dx + dy * dy;
      const r = ent.r;
      if (d2 < r * r) {
        const d = Math.sqrt(d2) || 0.001;
        const push = r - d;
        ent.x += (dx / d) * push;
        ent.y += (dy / d) * push;
        const dot = ent.vx * (dx / d) + ent.vy * (dy / d);
        if (dot < 0) {
          ent.vx -= (dx / d) * dot;
          ent.vy -= (dy / d) * dot;
        }
      }
    }
  },

  circleHitsObstacle(x, y, r) {
    for (const o of this.obstacles) {
      if (circleRectHit(x, y, r, o.x, o.y, o.w, o.h)) return true;
    }
    return false;
  },

  // Swept test: does the segment from (x0,y0) to (x1,y1) clip any box,
  // for a circle of radius r? Used by fast projectiles.
  segHitsObstacle(x0, y0, x1, y1, r) {
    for (const o of this.obstacles) {
      if (Physics.segRect(x0, y0, x1, y1, o.x, o.y, o.w, o.h, r)) return true;
    }
    return false;
  },

  renderBackground() {
    const c = document.createElement('canvas');
    c.width = CFG.arenaW;
    c.height = CFG.arenaH;
    const g = c.getContext('2d');
    const rng = makeRng(this.seed ^ 0x9e3779b9);

    g.fillStyle = CFG.colors.bg;
    g.fillRect(0, 0, CFG.arenaW, CFG.arenaH);

    for (let i = 0; i < 14; i++) {
      const x = rng() * CFG.arenaW, y = rng() * CFG.arenaH;
      const r = 180 + rng() * 420;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      const hue = 200 + Math.floor(rng() * 90);
      grad.addColorStop(0, 'hsla(' + hue + ',70%,50%,0.05)');
      grad.addColorStop(1, 'hsla(' + hue + ',70%,50%,0)');
      g.fillStyle = grad;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }

    g.strokeStyle = CFG.colors.bgGrid;
    g.lineWidth = 1;
    for (let x = 0; x <= CFG.arenaW; x += 100) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, CFG.arenaH); g.stroke();
    }
    for (let y = 0; y <= CFG.arenaH; y += 100) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(CFG.arenaW, y); g.stroke();
    }

    for (let i = 0; i < 220; i++) {
      const x = rng() * CFG.arenaW, y = rng() * CFG.arenaH;
      const a = 0.1 + rng() * 0.5;
      g.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      const s = rng() < 0.85 ? 1 : 2;
      g.fillRect(x, y, s, s);
    }

    g.strokeStyle = 'rgba(78,241,255,0.35)';
    g.lineWidth = 4;
    g.strokeRect(2, 2, CFG.arenaW - 4, CFG.arenaH - 4);
    g.strokeStyle = 'rgba(78,241,255,0.10)';
    g.lineWidth = 16;
    g.strokeRect(8, 8, CFG.arenaW - 16, CFG.arenaH - 16);

    this.bgCanvas = c;
  },

  drawObstacles(ctx) {
    for (const o of this.obstacles) {
      ctx.fillStyle = 'rgba(30,40,70,0.9)';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = 'rgba(120,160,255,0.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = 'rgba(78,241,255,0.8)';
      ctx.lineWidth = 3;
      const cl = 14;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + cl); ctx.lineTo(o.x, o.y); ctx.lineTo(o.x + cl, o.y);
      ctx.moveTo(o.x + o.w - cl, o.y); ctx.lineTo(o.x + o.w, o.y); ctx.lineTo(o.x + o.w, o.y + cl);
      ctx.moveTo(o.x + o.w, o.y + o.h - cl); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.lineTo(o.x + o.w - cl, o.y + o.h);
      ctx.moveTo(o.x + cl, o.y + o.h); ctx.lineTo(o.x, o.y + o.h); ctx.lineTo(o.x, o.y + o.h - cl);
      ctx.stroke();
    }
  },
};

// ------------------------------------------------------------
// Wave director: schedules spawns, banners, and bosses.
// ------------------------------------------------------------
const Waves = {
  wave: 0,
  queue: [],
  timer: 0,
  betweenT: 0,
  inIntro: false,
  bossWave: false,
  killsThisWave: 0,
  totalThisWave: 0,

  startWave(n) {
    this.wave = n;
    this.queue = [];
    this.killsThisWave = 0;
    this.inIntro = true;
    this.betweenT = CFG.waveIntroTime;
    AudioSys.waveStart();
    Game.waveScale = waveScale(n);

    if (n % CFG.bossEvery === 0) {
      this.bossWave = true;
      this.totalThisWave = 1;
      return;
    }
    this.bossWave = false;
    const comp = waveComposition(n);
    let budget = comp.budget;
    let t = 0;
    while (budget > 0) {
      // Spend the budget on affordable types; grunts are the filler.
      const options = comp.pool.filter(tn => (comp.cost[tn] || 2) <= budget);
      const tn = options.length > 0 ? pick(options) : 'grunt';
      const c = Math.min(comp.cost[tn] || 2, budget);
      budget -= c;
      const eliteChance = clamp((n - 4) * 0.02, 0, 0.22);
      const elite = chance(eliteChance) ? this.rollElite(n) : null;
      this.queue.push({ type: tn, t, elite });
      t += rand(0.25, 0.9) * Math.max(0.5, 1.6 - n * 0.05);
    }
    this.totalThisWave = this.queue.length;
  },

  rollElite(n) {
    const mod = pick(ELITE_MODS);
    return { name: mod.name, mods: Object.assign({}, mod.mult), tint: mod.tint };
  },

  update(dt) {
    if (this.inIntro) {
      this.betweenT -= dt;
      if (this.betweenT <= 0) this.inIntro = false;
      return;
    }
    if (this.bossWave) {
      if (!Boss.active && this.killsThisWave >= 1) {
        Game.onWaveClear();
      }
      return;
    }
    if (this.queue.length > 0) {
      this.timer -= dt;
      if (this.timer <= 0 && Enemies.aliveCount() < CFG.maxAliveEnemies) {
        const job = this.queue.shift();
        this.timer = Math.max(0.08, job.t);
        let x = 0, y = 0, tries = 0;
        do {
          const side = irand(0, 3);
          if (side === 0) { x = rand(60, CFG.arenaW - 60); y = 60; }
          else if (side === 1) { x = CFG.arenaW - 60; y = rand(60, CFG.arenaH - 60); }
          else if (side === 2) { x = rand(60, CFG.arenaW - 60); y = CFG.arenaH - 60; }
          else { x = 60; y = rand(60, CFG.arenaH - 60); }
          tries++;
        } while (dist2(x, y, Player.x, Player.y) < 380 * 380 && tries < 8);
        Enemies.spawn(job.type, x, y, Game.waveScale, job.elite);
        FX.ring(x, y, '#ff5c7a', 34, 0.4, 2);
      }
    } else if (Enemies.aliveCount() === 0) {
      Game.onWaveClear();
    }
  },
};

// ============================================================
// PHYSICS ENGINE v2 (VOIDBREAKER 1.1)
// Body-based top-down physics:
//   - semi-implicit integration with collision substeps
//   - per-body mass, restitution and drag
//   - knockback on its own fast-decaying impulse channel so it
//     never fights steering
//   - circle vs wall and circle vs AABB resolution with slide
//   - swept (continuous) segment tests so fast shots never
//     tunnel through thin targets
//   - pairwise crowd separation through a spatial hash
// ============================================================
const Physics = {
  hash: null,
  _near: [],

  init() {
    this.hash = new SpatialHash(72);
  },

  // Body factory. Anything with x, y, vx, vy, r works as a body.
  // Optional: mass, rest (restitution), wall (arena bounce, default true).
  body(x, y, r, o) {
    o = o || {};
    return {
      x: x, y: y, vx: 0, vy: 0,
      kx: 0, ky: 0,   // knockback channel, decays fast
      r: r,
      mass: o.mass || 1,
      rest: o.rest !== undefined ? o.rest : 0.35,
      wall: o.wall !== false,
    };
  },

  // Add an instantaneous velocity change to the knockback channel.
  impulse(b, ix, iy) {
    b.kx = (b.kx || 0) + ix;
    b.ky = (b.ky || 0) + iy;
  },

  // Knockback away from a source point.
  knockFrom(b, sx, sy, power) {
    const a = ang(sx, sy, b.x, b.y);
    this.impulse(b, Math.cos(a) * power, Math.sin(a) * power);
  },

  // Semi-implicit integration with collision substeps.
  // opts: { knockDecay, substeps, drag }
  integrate(b, dt, opts) {
    opts = opts || {};
    // Knockback decays exponentially, spring-like recovery.
    const kd = Math.exp(-(opts.knockDecay || 6.5) * dt);
    b.kx = (b.kx || 0) * kd; b.ky = (b.ky || 0) * kd;
    if (Math.abs(b.kx) < 2) b.kx = 0;
    if (Math.abs(b.ky) < 2) b.ky = 0;

    let vx = b.vx + b.kx;
    let vy = b.vy + b.ky;
    const dr = opts.drag || 0;
    if (dr > 0) {
      const f = Math.exp(-dr * dt);
      vx *= f; vy *= f;
    }

    const steps = opts.substeps || 2;
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      b.x += vx * sdt;
      b.y += vy * sdt;
      this.collide(b);
    }
    return { vx: vx, vy: vy };
  },

  // Resolve one body against arena walls and world obstacles.
  collide(b) {
    const rest = b.rest !== undefined ? b.rest : 0.35;
    if (b.wall !== false) {
      if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx = -b.vx * rest; if (b.kx < 0) b.kx = -b.kx * rest; }
      else if (b.x > CFG.arenaW - b.r) { b.x = CFG.arenaW - b.r; if (b.vx > 0) b.vx = -b.vx * rest; if (b.kx > 0) b.kx = -b.kx * rest; }
      if (b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy = -b.vy * rest; if (b.ky < 0) b.ky = -b.ky * rest; }
      else if (b.y > CFG.arenaH - b.r) { b.y = CFG.arenaH - b.r; if (b.vy > 0) b.vy = -b.vy * rest; if (b.ky > 0) b.ky = -b.ky * rest; }
    }
    for (const o of World.obstacles) {
      const nx = clamp(b.x, o.x, o.x + o.w);
      const ny = clamp(b.y, o.y, o.y + o.h);
      const dx = b.x - nx, dy = b.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 >= b.r * b.r) continue;
      const d = Math.sqrt(d2);
      if (d < 0.0001) {
        // Center inside the box: eject along the shallowest axis.
        const left = b.x - o.x, right = o.x + o.w - b.x;
        const top = b.y - o.y, bottom = o.y + o.h - b.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) { b.x = o.x - b.r; if (b.vx > 0) b.vx = -b.vx * rest; }
        else if (m === right) { b.x = o.x + o.w + b.r; if (b.vx < 0) b.vx = -b.vx * rest; }
        else if (m === top) { b.y = o.y - b.r; if (b.vy > 0) b.vy = -b.vy * rest; }
        else { b.y = o.y + o.h + b.r; if (b.vy < 0) b.vy = -b.vy * rest; }
        continue;
      }
      const ux = dx / d, uy = dy / d;
      const push = b.r - d;
      b.x += ux * push;
      b.y += uy * push;
      const dot = b.vx * ux + b.vy * uy;
      if (dot < 0) {
        b.vx -= (1 + rest) * dot * ux;
        b.vy -= (1 + rest) * dot * uy;
      }
      const kdot = (b.kx || 0) * ux + (b.ky || 0) * uy;
      if (kdot < 0) {
        b.kx -= kdot * ux;
        b.ky -= kdot * uy;
      }
    }
  },

  // Pairwise circle separation over a spatial hash. Mass-weighted,
  // with closing-velocity removal so nothing vibrates.
  resolvePairs(items, count) {
    this.hash.clear();
    for (let i = 0; i < count; i++) {
      const e = items[i];
      if (e.alive) this.hash.insert(e);
    }
    for (let i = 0; i < count; i++) {
      const e = items[i];
      if (!e.alive) continue;
      const q = this.hash.query(e.x, e.y, e.r + 40, this._near);
      for (let j = 0; j < q.length; j++) {
        const o = q[j];
        if (o === e || !o.alive) continue;
        const dx = e.x - o.x, dy = e.y - o.y;
        const minD = e.r + o.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD || d2 < 0.0001) continue;
        const d = Math.sqrt(d2);
        const overlap = minD - d;
        const me = e.mass || 1, mo = o.mass || 1;
        const totalM = me + mo;
        const ux = dx / d, uy = dy / d;
        // Positional correction, weighted by the other body's mass.
        const share = overlap * (mo / totalM);
        e.x += ux * share;
        e.y += uy * share;
        const rel = (e.vx - o.vx) * ux + (e.vy - o.vy) * uy;
        if (rel < 0) {
          e.vx -= rel * ux * (mo / totalM) * 1.4;
          e.vy -= rel * uy * (mo / totalM) * 1.4;
          o.vx += rel * ux * (me / totalM) * 1.4;
          o.vy += rel * uy * (me / totalM) * 1.4;
        }
      }
    }
  },

  // Continuous collision: does the segment (x0,y0)-(x1,y1) pass within
  // cr of (cx,cy)?
  segCircle(x0, y0, x1, y1, cx, cy, cr) {
    const dx = x1 - x0, dy = y1 - y0;
    const len2 = dx * dx + dy * dy;
    let t = 0;
    if (len2 > 0.0001) {
      t = ((cx - x0) * dx + (cy - y0) * dy) / len2;
      t = clamp(t, 0, 1);
    }
    const px = x0 + dx * t, py = y0 + dy * t;
    return dist2(px, py, cx, cy) <= cr * cr;
  },

  // Continuous circle vs AABB along a segment (sampled, bounded steps).
  segRect(x0, y0, x1, y1, rx, ry, rw, rh, cr) {
    const len = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    const steps = Math.max(1, Math.ceil(len / Math.max(2, cr * 0.9)));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      if (circleRectHit(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, cr, rx, ry, rw, rh)) return true;
    }
    return false;
  },
};

// ============================================================
// UI v1.1: HUD, cinematic intro, menus with entrance animations,
// level-up cards, minimap, scrollable shop, dev log.
// Everything renders on the game canvas.
// ============================================================

// Screen transition driver. Out-phase darkens the old screen, then the
// state switches, then the in-phase reveals the new one.
const Trans = {
  active: false, mode: 'out', t: 0, next: null,

  dur() { return Save.data && Save.data.settings.reducedMotion ? 0.12 : 0.26; },

  go(state) {
    if (this.active) return;
    if (Game.state === state) return;
    this.next = state;
    this.active = true;
    this.mode = 'out';
    this.t = 0;
  },

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    if (this.t >= this.dur()) {
      if (this.mode === 'out') {
        this.mode = 'in';
        this.t = 0;
        Game.setState(this.next);
        this.next = null;
      } else {
        this.active = false;
      }
    }
  },

  // Blocking: the old screen is still showing, input should wait.
  closing() { return this.active && this.mode === 'out'; },

  draw() {
    if (!this.active) return;
    const p = clamp(this.t / this.dur(), 0, 1);
    const e = p * p * (3 - 2 * p);
    const a = this.mode === 'out' ? e : 1 - e;
    ctx.fillStyle = 'rgba(3,3,12,' + (a * 0.99).toFixed(3) + ')';
    ctx.fillRect(0, 0, UI.vw(), UI.vh());
  },
};

const UI = {
  // Layout helpers ------------------------------------------------
  vw() { return canvas.width / DPR; },
  vh() { return canvas.height / DPR; },
  motion() { return !Save.data.settings.reducedMotion; },

  // Entrance animation time, reset whenever a screen is entered.
  enterT: 0,

  // Staggered entrance progress for element i of a screen.
  // Returns eased progress p, a y-offset and an alpha.
  st(i, dur, delay) {
    if (!this.motion()) return { p: 1, oy: 0, a: 1 };
    const t = this.enterT - (delay || 0) - i * 0.055;
    const p = clamp(t / (dur || 0.4), 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    return { p: e, oy: (1 - e) * 26, a: e };
  },

  panel(x, y, w, h, alpha) {
    ctx.fillStyle = 'rgba(10,14,30,' + (alpha || 0.88) + ')';
    ctx.strokeStyle = 'rgba(78,241,255,0.35)';
    ctx.lineWidth = 2;
    const r = 10;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  },

  bar(x, y, w, h, frac, color, bgAlpha) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  },

  // In-game HUD ----------------------------------------------------
  drawHUD() {
    const w = this.vw(), h = this.vh();
    const pad = 16;

    // Health bar, top left.
    const hpFrac = Player.hp / Player.maxHp;
    const hpColor = hpFrac > 0.35 ? CFG.colors.hp : CFG.colors.hpLow;
    this.bar(pad, pad, 220, 14, hpFrac, hpColor);
